<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Cloud Computing Quiz</title>
    <style>
    :root {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --text-color: #e0e0e0;
        --accent-color: #bb86fc;
        --correct-color: #4caf50;
        --wrong-color: #f44336;
        --tab-inactive: #333;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.5;
    }

    header {
        width: 100%;
        padding: 1.5rem 0;
        text-align: center;
        background: #1a1a1a;
        border-bottom: 2px solid var(--accent-color);
    }

    h1 { font-size: 1.4rem; margin: 0 10px; }
    header p { font-size: 0.9rem; margin-top: 5px; opacity: 0.8; }

    .tabs {
        display: flex;
        gap: 8px;
        position: sticky;
        top: 0;
        background: var(--bg-color);
        padding: 12px;
        z-index: 100;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap; /* Important for mobile: wraps buttons to next line */
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .tab-btn {
        padding: 8px 14px;
        background: var(--tab-inactive);
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 20px; /* Rounded pill style looks better on mobile */
        transition: 0.3s;
        font-size: 0.85rem;
        white-space: nowrap;
    }

    .tab-btn.active {
        background: var(--accent-color);
        color: black;
        font-weight: bold;
    }

    .container {
        width: 95%; /* More width on mobile */
        max-width: 800px;
        padding: 20px 0 80px 0;
    }

    .question-card {
        background: var(--card-bg);
        padding: 18px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .question-text {
        font-size: 1rem;
        margin-bottom: 15px;
        font-weight: 500;
        color: #ffffff;
    }

    .options-list {
        list-style: none;
        padding: 0;
    }

    .option {
        padding: 14px; /* Larger tap target */
        margin: 10px 0;
        background: #2d2d2d;
        border: 1px solid #444;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.95rem;
        -webkit-tap-highlight-color: transparent; /* Removes blue flash on mobile tap */
    }

    .option.correct {
        background-color: var(--correct-color) !important;
        border-color: var(--correct-color);
        color: white;
    }

    .option.wrong {
        background-color: var(--wrong-color) !important;
        border-color: var(--wrong-color);
        color: white;
    }

    .feedback {
        margin-top: 12px;
        font-size: 0.9rem;
        padding: 10px;
        border-radius: 5px;
        background: rgba(255, 152, 0, 0.1);
        display: none;
    }

    /* Hide scrollbar for tab container if needed */
    .tabs::-webkit-scrollbar {
        display: none;
    }
</style>
</head>
<body>

<header>
    <h1>SRINIVAS UNIVERSITY</h1>
    <p>Introduction to AI and Cloud Computing (25BCA23)</p>
</header>

<div class="tabs" id="tabBar">
    <button class="tab-btn active" onclick="showModule(1)">Module 1</button>
    <button class="tab-btn" onclick="showModule(2)">Module 2</button>
    <button class="tab-btn" onclick="showModule(3)">Module 3</button>
    <button class="tab-btn" onclick="showModule(4)">Module 4</button>
    <button class="tab-btn" onclick="showModule(5)">Module 5</button>
</div>

<div class="container" id="quizContainer">
    <!-- Questions will be injected here by JavaScript -->
</div>

<script>
const quizData = {
    1: [
        { q: "1. Which branch of computer science is concerned with the study and creation of computer system that execute some form of intelligence?", a: "c", options: { a: "Data mining", b: "Expert system", c: "Artificial intelligence", d: "Electronic intelligence" }},
        { q: "2. Who coined the term “Artificial Intelligence”?", a: "b", options: { a: "Alan turing", b: "John McCarthy", c: "Newan", d: "Newell" }},
        { q: "3. What is the system that uses artificial intelligence and rules about behavior?", a: "b", options: { a: "Production system", b: "Heuristic system", c: "Intelligent system", d: "State space system" }, note: "Note: PDF lists Answer as 'b. Production system' despite label mismatch."},
        { q: "4. When did semantic net develop?", a: "d", options: { a: "Classical Period", b: "Ancient Period", c: "Modern Period", d: "Romantic Period" }},
        { q: "5. Which category of AI tasks does Games belong to?", a: "c", options: { a: "Mundane Tasks", b: "Expert Tasks", c: "Formal Tasks", d: "Perception Tasks" }},
        { q: "6. Give an example of a production system that is both partially commutative and monotonic?", a: "a", options: { a: "Theorem proving", b: "Chemical synthesis", c: "Robot navigation", d: "Game playing" }},
        { q: "7. Natural Language Processing (NLP) belong to which category?", a: "c", options: { a: "Formal tasks", b: "Informal Tasks", c: "Mundane tasks", d: "Expert Tasks" }},
        { q: "8. What is the Space complexity of Depth First Search?", a: "b", options: { a: "O(b)", b: "O(d)", c: "O(bd)", d: "O(db)" }}
    ],
    2: [
        { q: "33. Define the term used to describe the facts, information, and skills acquired through experience or education?", a: "b", options: { a: "Belief", b: "Knowledge", c: "Hypothesis", d: "Trust" }},
        { q: "34. What is compiled knowledge related to the performance of some task?", a: "a", options: { a: "Procedural knowledge", b: "Declarative knowledge", c: "Semantic knowledge", d: "Syntactic knowledge" }},
        { q: "35. What is passive knowledge expressed as statements of facts about the world?", a: "b", options: { a: "Procedural knowledge", b: "Declarative knowledge", c: "Semantic knowledge", d: "Syntactic knowledge" }},
        { q: "36. What is a true justified belief defined as?", a: "b", options: { a: "Trust", b: "Knowledge", c: "Belief", d: "Hypothesis" }},
        { q: "37. What is a justified belief that is not known to be true?", a: "c", options: { a: "Belief", b: "Knowledge", c: "Hypothesis", d: "Trust" }},
        { q: "38. What is the study of the nature called?", a: "b", options: { a: "Phonology", b: "Epistemology", c: "Morphology", d: "Lexicology" }},
        { q: "39. What is the simplest heuristic search strategy that operates as an exhaustive search of the problem space?", a: "c", options: { a: "Hill Climbing", b: "Best First Search", c: "Generate and Test", d: "Problem Reduction" }},
        { q: "40. List the two lists of nodes used in the Best First Search algorithm to keep track of generated and examined nodes.", a: "b", options: { a: "START and GOAL", b: "OPEN and CLOSED", c: "ASCENT and DESCENT", d: "SUCCESSOR and PARENT" }}
    ],
    3: [
        { q: "65. Which knowledge is used to convert the sounds into character?", a: "a", options: { a: "Phonological", b: "Morphological", c: "Syntactical", d: "Semantic" }},
        { q: "66. How is a Phoneme defined in the study of language structure?", a: "b", options: { a: "As a unit of written grammar", b: "As the smallest unit of sound that distinguishes meaning", c: "As the total set of words in a dictionary", d: "As a symbol that represents an object" }},
        { q: "67. Which term is defined as the smallest unit of a language that carries an individual meaning?", a: "c", options: { a: "Phoneme", b: "Lexicon", c: "Morpheme", d: "Icon" }},
        { q: "68. What type of knowledge relates to how words are formed in a language?", a: "b", options: { a: "Semantic", b: "Morphological", c: "Syntactical", d: "Phonological" }},
        { q: "69. What type of knowledge deals with the rules for arranging words to form grammatically correct sentence?", a: "b", options: { a: "Morphological", b: "Syntactic", c: "Semantic", d: "World" }},
        { q: "70. What are the symbols that are further broken down in a grammar called?", a: "b", options: { a: "Terminals", b: "Non-terminals", c: "Root", d: "Empty string" }},
        { q: "71. In a formal grammar, why is a Noun Phrase classified as a non-terminal symbol?", a: "b", options: { a: "It represents a single, specific word in a sentence.", b: "It is a category that can be further expanded into simpler components.", c: "It is the final element that cannot be broken down.", d: "It acts as the root of every possible language tree." }},
        { q: "72. In a formal grammar, what is the role of symbols that cannot be further decomposed?", a: "c", options: { a: "Root", b: "Empty string", c: "Terminal", d: "non-terminal" }}
    ],
    4: [
        { q: "97. How would you enhance user interaction on a website by allowing customers to leave reviews, share posts, and collaborate through forums?", a: "b", options: { a: "Web 1.0", b: "Web 2.0", c: "Web 3.0", d: "Cloud Computing" }},
        { q: "98. How would you use Amazon Web Services to deploy a cloud-based application?", a: "c", options: { a: "Software as a Service (SaaS)", b: "Platform as a Service (PaaS)", c: "Infrastructure as a Service (IaaS)", d: "Database as a Service (DBaaS)" }},
        { q: "99. An organization needs both secure private resources and scalable public cloud services. Which cloud deployment model should it use?", a: "c", options: { a: "Private", b: "Public", c: "Hybrid", d: "Community" }},
        { q: "100. How would you identify which cloud deployment model is exclusively used by a single organization and offers greater control over security and resources?", a: "c", options: { a: "Public", b: "Hybrid", c: "Internal Cloud", d: "Community" }},
        { q: "101. Predict the possible consequences for a company that operates entirely using the Public Cloud model.", a: "d", options: { a: "Private", b: "Public", c: "Hybrid", d: "Multiple Organizations Sharing Resources" }},
        { q: "102. What changes would you make to a network setup to allow multiple operating systems to run on a single physical machine?", a: "a", options: { a: "Hardware Virtualization", b: "Server Virtualization", c: "Storage Virtualization", d: "Data Virtualization" }},
        { q: "103. How would you use distributed computing to turn a network into a supercomputer for solving complex tasks?", a: "b", options: { a: "Cloud computing", b: "Grid computing", c: "Utility computing", d: "Virtualization" }},
        { q: "104. How would you design a web-based platform that allows students to share notes and collaborate on projects using Web 2.0 tools?", a: "b", options: { a: "Static web pages with only reading access", b: "User login with content sharing and commenting system", c: "Offline desktop application without internet access", d: "Read-only PDF document repository" }}
    ],
    5: [
        { q: "129. How would you use a cloud-based solution to ensure your team that can edit the same document simultaneously from different locations?", a: "b", options: { a: "Store it on a local NAS drive", b: "Upload it to Google Drive", c: "Save it on a physical Hard Disk", d: "Email copies to everyone" }},
        { q: "130. How would you solve the problem of physical hardware limitations when scaling a company's storage needs?", a: "b", options: { a: "Install more NAS units", b: "Deploy Data centers", c: "Use local virtualization", d: "Increase RAM" }},
        { q: "131. What would you do if you need to prevent unauthorized access to a user's account even after their password was leaked?", a: "b", options: { a: "Change the username", b: "Implement Mobile ID Management (MIM) for 2FA", c: "Use Single Sign On (SSO)", d: "Disable the internet connection" }},
        { q: "132. What would you do if your company need to host a website but wanted to avoid the cost of buying and maintaining physical servers?", a: "b", options: { a: "Increase the local bandwidth", b: "Implement Infrastructure as a Service (IaaS)", c: "Install more RAM in local machines", d: "Use a browser-based development environment" }},
        { q: "133. What would you do to distribute workloads & computing resources within a cloud technology's environment.", a: "a", options: { a: "Cloud load-balancing", b: "Multi-factor authentication", c: "Single Sign On", d: "Network Attached Storage" }},
        { q: "134. How can developers edit application code in PaaS?", a: "b", options: { a: "Only via command-line interface", b: "Via Application Programming Interface (API) or point-and-click tools", c: "Only using third-party software", d: "Only through manual database scripts" }},
        { q: "135. How would you use OpenID to simplify user authentication across multiple websites?", a: "b", options: { a: "Ask users to create a new account for every website", b: "Allow users to log in to multiple websites using a single ID", c: "Store each website’s password locally on the device", d: "Require users to reset their password daily" }},
        { q: "136. What approach would you use to simplify login processes for all users using IDaaS?", a: "b", options: { a: "Require separate credentials for each service", b: "Implement Single Sign-On (SSO) via IDaaS", c: "Store passwords locally", d: "Avoid identity management entirely" }}
    ]
};

function showModule(moduleNum) {
    // Update Tab UI
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`button[onclick="showModule(${moduleNum})"]`).classList.add('active');

    const container = document.getElementById('quizContainer');
    container.innerHTML = ''; // Clear current questions

    const questions = quizData[moduleNum];
    questions.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        let optionsHtml = '';
        for (const [key, value] of Object.entries(item.options)) {
            optionsHtml += `<li class="option" onclick="checkAnswer(this, '${key}', '${item.a}', 'feedback-${moduleNum}-${index}')">${key}) ${value}</li>`;
        }

        card.innerHTML = `
            <div class="question-text">${item.q}</div>
            <ul class="options-list">
                ${optionsHtml}
            </ul>
            <div id="feedback-${moduleNum}-${index}" class="feedback">Correct Answer: ${item.a}) ${item.options[item.a]}</div>
        `;
        container.appendChild(card);
    });
    window.scrollTo(0,0);
}

function checkAnswer(element, selected, correct, feedbackId) {
    const parent = element.parentElement;
    const options = parent.querySelectorAll('.option');
    const feedbackDiv = document.getElementById(feedbackId);

    // Disable further clicks for this question
    options.forEach(opt => opt.style.pointerEvents = 'none');

    if (selected === correct) {
        element.classList.add('correct');
    } else {
        element.classList.add('wrong');
        // Find and highlight the correct one
        options.forEach(opt => {
            if (opt.innerText.startsWith(correct + ')')) {
                opt.classList.add('correct');
            }
        });
        feedbackDiv.style.display = 'block';
        feedbackDiv.style.color = '#ff9800';
    }
}

// Initialize with Module 1
showModule(1);
</script>

</body>
</html>
