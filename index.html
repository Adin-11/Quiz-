<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Technologies with Microsoft Azure – Interactive Quiz</title>
  <style>
    :root {
      --bg: #0d0f13;
      --surface: #14161b;
      --surface-opt: #191c22;
      --surface-opt-hover: #21252e;
      --border: #262a34;
      --border-opt: #2d323e;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --green-bg: rgba(6, 78, 59, 0.55);
      --green-border: #10b981;
      --green-text: #d1fae5;
      --green-label: #6ee7b7;
      --red-bg: rgba(127, 29, 29, 0.55);
      --red-border: #f43f5e;
      --red-text: #ffe4e6;
      --red-label: #fda4af;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 56px;
    }

    @media (min-width: 640px) {
      .container {
        padding: 32px 24px 72px;
      }
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .subtitle {
      margin: 0 0 8px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .meta-line {
      margin: 0 0 20px;
      color: #71717a;
      font-size: 0.85rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      max-width: 100%;
      padding-bottom: 4px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: #181b22;
      color: #d4d4d8;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 42px;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .tab-btn:hover {
      background: #222630;
      color: #ffffff;
    }

    .tab-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
    }

    .tab-btn:focus-visible,
    .opt-btn:focus-visible,
    .action-btn:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }

    .progress-text {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 16px;
    }

    @media (min-width: 640px) {
      .q-card {
        padding: 22px 24px;
      }
    }

    .q-title {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #f4f4f5;
      line-height: 1.5;
    }

    @media (min-width: 640px) {
      .q-title {
        font-size: 1.05rem;
      }
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      appearance: none;
      width: 100%;
      min-height: 46px;
      text-align: left;
      background: var(--surface-opt);
      border: 1px solid var(--border-opt);
      border-radius: 8px;
      padding: 12px 14px;
      color: #e4e4e7;
      font-size: 0.94rem;
      line-height: 1.45;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .opt-btn:hover:not(:disabled) {
      background: var(--surface-opt-hover);
      border-color: #3f4656;
    }

    .opt-btn:disabled {
      cursor: default;
    }

    .opt-btn.is-correct {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-text);
    }

    .opt-btn.is-wrong {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
    }

    .opt-btn.is-dimmed {
      background: #13151a;
      border-color: #20232c;
      color: #71717a;
    }

    .opt-badge {
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .opt-badge.correct {
      color: var(--green-label);
    }

    .opt-badge.wrong {
      color: var(--red-label);
    }

    .answer-callout {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--green-label);
      font-weight: 500;
    }

    .footer-actions {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 11px 20px;
      min-height: 44px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .action-primary {
      background: var(--blue);
      color: #ffffff;
    }

    .action-primary:hover {
      background: var(--blue-hover);
    }

    .action-secondary {
      background: #1c1f27;
      border-color: var(--border);
      color: #e4e4e7;
    }

    .action-secondary:hover {
      background: #252934;
    }

    .score-box {
      margin-top: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      display: none;
    }

    .score-box.visible {
      display: block;
    }

    .score-heading {
      margin: 0 0 6px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .score-meta {
      margin: 0;
      font-size: 0.92rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>All Modules – Interactive Quiz</h1>
    <p class="subtitle">Click a module tab, select answers, get instant feedback, then show your score.</p>
    <p class="meta-line">Web Technologies with Microsoft Azure · B.C.A – III Semester · 5 Modules · 100 MCQs</p>

    <div class="toolbar">
      <div class="tabs" id="module-tabs" role="tablist" aria-label="Quiz Modules"></div>
      <div class="progress-text" id="module-progress">0 / 20 answered</div>
    </div>

    <div class="questions-list" id="questions-list"></div>

    <div class="footer-actions">
      <button type="button" class="action-btn action-primary" id="show-score-btn">Show Score</button>
      <button type="button" class="action-btn action-secondary" id="reset-module-btn">Reset Module</button>
    </div>

    <section class="score-box" id="score-box" aria-live="polite">
      <h2 class="score-heading" id="score-heading"></h2>
      <p class="score-meta" id="score-meta"></p>
    </section>
  </main>

  <script>
    (function () {
      const MODULES = [{"id":"module-1","label":"Module 1","title":"MODULE 1","questions":[{"number":1,"question":"1. What is an IP address?","options":[{"key":"A","text":"A. A name given to a website"},{"key":"B","text":"B. A unique numerical label assigned to each device on a network"},{"key":"C","text":"C. A type of web browser"},{"key":"D","text":"D. A protocol for sending emails"}],"correctKey":"B","answerText":"Answer: B. A unique numerical label assigned to each device on a network"},{"number":2,"question":"2. What does DNS stand for?","options":[{"key":"A","text":"A. Data Network System"},{"key":"B","text":"B. Domain Name Server"},{"key":"C","text":"C. Domain Name System"},{"key":"D","text":"D. Digital Network Service"}],"correctKey":"C","answerText":"Answer: C. Domain Name System"},{"number":3,"question":"3. Which of the following is a void (empty) HTML element?","options":[{"key":"A","text":"A. <p>"},{"key":"B","text":"B. <div>"},{"key":"C","text":"C. <img>"},{"key":"D","text":"D. <span>"}],"correctKey":"C","answerText":"Answer: C. <img>"},{"number":4,"question":"4. Which HTML tag is used to create hyperlink?","options":[{"key":"A","text":"A. <a>"},{"key":"B","text":"B. <link>"},{"key":"C","text":"C. <href>"},{"key":"D","text":"D. <url>"}],"correctKey":"A","answerText":"Answer: A. <a>"},{"number":5,"question":"5. What is a Web Browser?","options":[{"key":"A","text":"A. A software used to design websites"},{"key":"B","text":"B. A server that stores web pages"},{"key":"C","text":"C. A software application used to access and view websites"},{"key":"D","text":"D. A type of internet service provider"}],"correctKey":"C","answerText":"Answer: C. A software application used to access and view websites"},{"number":6,"question":"6. What is the function of a Web Server?","options":[{"key":"A","text":"A. It sends requests to the client"},{"key":"B","text":"B. It provides internet connectivity to users"},{"key":"C","text":"C. It translates domain names to IP addresses"},{"key":"D","text":"D. It stores and serves web pages to clients upon request"}],"correctKey":"D","answerText":"Answer: D. It stores and serves web pages to clients upon request"},{"number":7,"question":"7. What does the HTTP status code 404 indicate?","options":[{"key":"A","text":"A. Request was successful"},{"key":"B","text":"B. Internal server error"},{"key":"C","text":"C. The request has been redirected"},{"key":"D","text":"D. The requested resource was not found"}],"correctKey":"D","answerText":"Answer: D. The requested resource was not found"},{"number":8,"question":"8. What is Azure Static Web Apps primarily used for?","options":[{"key":"A","text":"A. To manage database servers"},{"key":"B","text":"B. To host and deploy static websites"},{"key":"C","text":"C. To create virtual machines on the cloud"},{"key":"D","text":"D. To monitor network traffic"}],"correctKey":"B","answerText":"Answer: B. To host and deploy static websites"},{"number":9,"question":"9. What is the correct structure of a URL?","options":[{"key":"A","text":"A. protocol://path/domain"},{"key":"B","text":"B. protocol://domain/path"},{"key":"C","text":"C. domain://protocol/path"},{"key":"D","text":"D. path://domain/protocol"}],"correctKey":"B","answerText":"Answer: B. protocol://domain/path"},{"number":10,"question":"10. Which element is used to create a table heading in HTML?","options":[{"key":"A","text":"A. <tr>"},{"key":"B","text":"B. <td>"},{"key":"C","text":"C. <thead>"},{"key":"D","text":"D. <th>"}],"correctKey":"D","answerText":"Answer: D. <th>"},{"number":11,"question":"11. How would you use an IP address and DNS together to access a website?","options":[{"key":"A","text":"A. Use DNS to translate the domain names into an IP address to reach the server"},{"key":"B","text":"B. Use the IP address to create a new domain name for the website"},{"key":"C","text":"C. Use the IP address to resolve the DNS server address"},{"key":"D","text":"D. Use DNS to host the website files and IP address to display them"}],"correctKey":"A","answerText":"Answer: A. Use DNS to translate the domain names into an IP address to reach the server"},{"number":12,"question":"12. How would you use Microsoft Azure to host a website?","options":[{"key":"A","text":"A. Store the website files in Azure Active Directory"},{"key":"B","text":"B. Configure a virtual network manually"},{"key":"C","text":"C. Deploy files to Azure Static Web Apps"},{"key":"D","text":"D. Upload files to an Azure DevOps repository only"}],"correctKey":"C","answerText":"Answer: C. Deploy files to Azure Static Web Apps"},{"number":13,"question":"13. What approach would you use to create both ordered and unordered lists in HTML?","options":[{"key":"A","text":"A. Use <list>and <items> tags"},{"key":"B","text":"B. Use <ul>for ordered lists and <ol>for unordered lists"},{"key":"C","text":"C. Use <ol> for ordered lists and <ul> for unordered lists"},{"key":"D","text":"D. Use a single <list> tag with a type attribute"}],"correctKey":"C","answerText":"Answer: C. Use <ol> for ordered lists and <ul> for unordered lists"},{"number":14,"question":"14. What approach would you use to link one webpage to another in HTML?","options":[{"key":"A","text":"A. Use <link> tag with src attribute"},{"key":"B","text":"B. Use <a> tag with href attribute"},{"key":"C","text":"C. Use <nav> tag with url attribute"},{"key":"D","text":"D. Use <div> tag with hrefattribute"}],"correctKey":"B","answerText":"Answer: B. Use <a> tag with href attribute"},{"number":15,"question":"15. How would you use the <table> element to organize data on a webpage?","options":[{"key":"A","text":"A. By using <table> with <row> and <col> tags"},{"key":"B","text":"B. By using <table> with <thead> and <tdata> tags only"},{"key":"C","text":"C. By using <table> with <p> and <div> tags"},{"key":"D","text":"D. By using <table> with <tr>, <td>, and <th> tags"}],"correctKey":"D","answerText":"Answer: D. By using <table> with <tr>, <td>, and <th> tags"},{"number":16,"question":"16. What would happen if the DNS sever is unavailable while browsing?","options":[{"key":"A","text":"A. The website will not load"},{"key":"B","text":"B. The website loads normally through a local backup"},{"key":"C","text":"C. The webpage loads slowly with images missing"},{"key":"D","text":"D. The web server directly connects without needing any address"}],"correctKey":"A","answerText":"Answer: A. The website will not load"},{"number":17,"question":"17. How would you display an image on a webpage using HTML?","options":[{"key":"A","text":"A. Use <image> tag with the link attribute"},{"key":"B","text":"B. Use <img> tag with src attribute"},{"key":"C","text":"C. Use <media> tag with href attribute"},{"key":"D","text":"D. Use <picture> tag with url attribute"}],"correctKey":"B","answerText":"Answer: B. Use <img> tag with src attribute"},{"number":18,"question":"18. What approach would you use to structure a user registration form in HTML?","options":[{"key":"A","text":"A. Use <form>with appropriate <input> fields and submit buttons"},{"key":"B","text":"B. Use <div>with <label> tags for text, email, and password fields"},{"key":"C","text":"C. Use <section>with plain text and an anchor link"},{"key":"D","text":"D. Use <table> with <td> cells without a form container"}],"correctKey":"A","answerText":"Answer: A. Use <form>with appropriate <input> fields and submit button"},{"number":19,"question":"19. What approach would you use to access Microsoft Azure services?","options":[{"key":"A","text":"A. By downloading the Azure desktop application and logging in with any email account"},{"key":"B","text":"B. By signing in through the Azure Portal using a Microsoft account"},{"key":"C","text":"C. By accessing Azure services through the GitHub repository settings"},{"key":"D","text":"D. By using the Azure CLI only without any browser based portal"}],"correctKey":"B","answerText":"Answer: B. By signing in through the Azure Portal using a Microsoft account"},{"number":20,"question":"20. What would happen if you deploy an updated HTML file to a repository connected to Azure Static Web Apps?","options":[{"key":"A","text":"A. The updated website is automatically built and redeployed through the connected workflow"},{"key":"B","text":"B. The existing website is permanently deleted without deploying the update"},{"key":"C","text":"C. The HTML file is converted into an Azure database table"},{"key":"D","text":"D. The website can be updated only by manually creating a new Azure resource"}],"correctKey":"A","answerText":"Answer: A. The updated website is automatically built and redeployed through the connected workflow"}]},{"id":"module-2","label":"Module 2","title":"MODULE 2","questions":[{"number":1,"question":"1. What is a semantic HTML element?","options":[{"key":"A","text":"A. An element that adds color to the webpage"},{"key":"B","text":"B. An element whose tag name describes the meaning and role of its content"},{"key":"C","text":"C. An element that only works in HTML5"},{"key":"D","text":"D. An element used only for navigation"}],"correctKey":"B","answerText":"Answer: B. An element whose tag name describes the meaning and role of its content"},{"number":2,"question":"2. What is the purpose of the <header> tag in HTML?","options":[{"key":"A","text":"A. To define the font size of the page"},{"key":"B","text":"B. To represent the introductory content of a page or section"},{"key":"C","text":"C. To create a navigation menu"},{"key":"D","text":"D. To display footer information"}],"correctKey":"B","answerText":"Answer: B. To represent the introductory content of a page or section"},{"number":3,"question":"3. What is the purpose of the ‘required’ attribute in an HTML form?","options":[{"key":"A","text":"A. To set a default value for the input field"},{"key":"B","text":"B. To style the input field"},{"key":"C","text":"C. To prevent form submission if the field is left empty"},{"key":"D","text":"D. To restrict the file type in a file upload"}],"correctKey":"C","answerText":"Answer: C. To prevent form submission if the field is left empty"},{"number":4,"question":"4. What semantic HTML element represents content that is related to, but not part of, the main content of a webpage?","options":[{"key":"A","text":"A. <section>"},{"key":"B","text":"B. <header>"},{"key":"C","text":"C. <article>"},{"key":"D","text":"D. <aside>"}],"correctKey":"D","answerText":"Answer: D. <aside>"},{"number":5,"question":"5. Which Microsoft Azure service is used to host static HTML, CSS and JavaScript websites?","options":[{"key":"A","text":"A. Azure Static Web Apps"},{"key":"B","text":"B. Azure Virtual Machine"},{"key":"C","text":"C. Azure SQL Database"},{"key":"D","text":"D. Azure Functions"}],"correctKey":"A","answerText":"Answer: A. Azure Static Web Apps"},{"number":6,"question":"6. What is the role of colspan in an HTML table?","options":[{"key":"A","text":"A. To merge rows vertically"},{"key":"B","text":"B. To add color to a column"},{"key":"C","text":"C. To make a single cell span across multiple columns horizontally"},{"key":"D","text":"D. To group columns together for styling"}],"correctKey":"C","answerText":"Answer: C. To make a single cell span across multiple columns horizontally"},{"number":7,"question":"7. What is the purpose of enctype=\"multipart/form-data\" in an HTML form?","options":[{"key":"A","text":"A. To encrypt the form data before sending"},{"key":"B","text":"B. To restrict the form to text input only"},{"key":"C","text":"C. To validate email format on submission"},{"key":"D","text":"D. To allow uploading and sending files along with form data"}],"correctKey":"D","answerText":"Answer: D. To allow uploading and sending files along with form data"},{"number":8,"question":"8. Which HTML attribute is used to validate user input against a specified regular expression?","options":[{"key":"A","text":"A. required"},{"key":"B","text":"B. pattern"},{"key":"C","text":"C. placeholder"},{"key":"D","text":"D. maxlength"}],"correctKey":"B","answerText":"Answer: B. pattern"},{"number":9,"question":"9. What is the primary purpose of the <article> tag in HTML?","options":[{"key":"A","text":"A. To group related sections together"},{"key":"B","text":"B. To represent standalone, self-contained element"},{"key":"C","text":"C. To link external stylesheets to a page"},{"key":"D","text":"D. To define the navigation menu of a webpage"}],"correctKey":"B","answerText":"Answer: B. To represent standalone, self-contained element"},{"number":10,"question":"10. Which Azure service can be used to store multimedia files such as images, audio, and videos?","options":[{"key":"A","text":"A. Azure SQL Database"},{"key":"B","text":"B. Azure Functions"},{"key":"C","text":"C. Azure Blob Storage"},{"key":"D","text":"D. Azure DevOps"}],"correctKey":"C","answerText":"Answer: C. Azure Blob Storage"},{"number":11,"question":"11. How does the <nav> tag relate to improving accessibility on a webpage?","options":[{"key":"A","text":"A. It automatically changes the navigation menu into a dropdown"},{"key":"B","text":"B. It prevents users from accessing links outside the navigation section"},{"key":"C","text":"C. It automatically adds styling to the navigation links"},{"key":"D","text":"D. It helps screen readers identify the navigation section of the webpage"}],"correctKey":"D","answerText":"Answer: D. It helps screen readers identify the navigation section of the webpage"},{"number":12,"question":"12. How does the accept attribute relate to restricting file selection in an HTML file input field?","options":[{"key":"A","text":"A. It automatically uploads the selected file to the server"},{"key":"B","text":"B. It restricts the selectable files to the specified file types"},{"key":"C","text":"C. It increases the maximum size of the selected file"},{"key":"D","text":"D. It encrypts the selected file before uploading"}],"correctKey":"B","answerText":"Answer: B. It restricts the selectable files to the specified file types"},{"number":13,"question":"13. How do validation layers relate to improving form validation in HTML?","options":[{"key":"A","text":"A. They add error colors to input fields"},{"key":"B","text":"B. They automatically fix incorrect input values"},{"key":"C","text":"C. They check input at multiple stages to prevent errors"},{"key":"D","text":"D. They restrict form fields to numeric values only"}],"correctKey":"C","answerText":"Answer: C. They check input at multiple stages to prevent errors"},{"number":14,"question":"14. What is meant by the <caption> element in an HTML table?","options":[{"key":"A","text":"A. It defines the first row of the table as a header row"},{"key":"B","text":"B. It merges the first column of the table with the header"},{"key":"C","text":"C. It adds a border around the entire table"},{"key":"D","text":"D. It provides a title or description for the table"}],"correctKey":"D","answerText":"Answer: D. It provides a title or description for the table"},{"number":15,"question":"15. How does the <header> tag differ from a <div> tag?","options":[{"key":"A","text":"A. <header> is semantic, while <div> is non-semantic"},{"key":"B","text":"B. <header> is inline, while <div> is block"},{"key":"C","text":"C. <header> only holds text, while <div> holds media"},{"key":"D","text":"D. <header> requires CSS, while <div> does not"}],"correctKey":"A","answerText":"Answer: A. <header> is semantic, while <div> is non-semantic"},{"number":16,"question":"16. What is the main idea behind using <thead>, <tbody>, and <tfoot> instead of using only <tr> elements?","options":[{"key":"A","text":"A. They automatically add colours and borders to different table rows"},{"key":"B","text":"B. They divide a table into meaningful sections for better organization"},{"key":"C","text":"C. They reduce the number of cells required in a table"},{"key":"D","text":"D. They convert a table into an interactive form"}],"correctKey":"B","answerText":"Answer: B. They divide a table into meaningful sections for better organization"},{"number":17,"question":"17. How does the placeholder attribute relate to helping users in an HTML form?","options":[{"key":"A","text":"A. It automatically fills the input field with permanent data"},{"key":"B","text":"B. It prevents the user from modifying the input field"},{"key":"C","text":"C. It validates the input against a specified pattern"},{"key":"D","text":"D. It displays a hint inside an input field until the user enters data"}],"correctKey":"D","answerText":"Answer: D. It displays a hint inside an input field until the user enters data"},{"number":18,"question":"18. How does type=\"date\"relate to improving the user experience compared to a plain text input?","options":[{"key":"A","text":"A. It allows users to enter only numbers without selecting a date"},{"key":"B","text":"B. It automatically submits the form after a date is selected"},{"key":"C","text":"C. It provides a date-selection interface and helps users enter a valid date"},{"key":"D","text":"D. It stores the selected date permanently in the browser"}],"correctKey":"C","answerText":"Answer: C. It provides a date-selection interface and helps users enter a valid date"},{"number":19,"question":"19. How does the controls attribute relate to the usability of <audio> and<video> elements?","options":[{"key":"A","text":"A. It provides built-in controls such as play, pause, and volume"},{"key":"B","text":"B. It automatically downloads the media file to the user's device"},{"key":"C","text":"C. It converts the media file into a different format"},{"key":"D","text":"D. It prevents the media from being played more than once"}],"correctKey":"A","answerText":"Answer: A. It provides built-in controls such as play, pause, and volume"},{"number":20,"question":"20. How does the <video> tag differ from the <iframe> tag for embedding media?","options":[{"key":"A","text":"A. <video> embeds external links, while <iframe> plays local files"},{"key":"B","text":"B. <video> play es based on screen width"},{"number":13,"question":"13. What approach would you use to arrange a set of navigation links horizontally using CSS?","options":[{"key":"A","text":"A. Set display:block on the container element"},{"key":"B","text":"B. Set display:flex on the container element"},{"key":"C","text":"C. Set display:inline on the container element"},{"key":"D","text":"D. Set display:grid on each individual link"}],"correctKey":"B","answerText":"Answer: B. Set display:flex on the container element"},{"number":14,"question":"14. How would you change the text color of a heading to blue using CSS?","options":[{"key":"A","text":"A. Set background-color: blue; for the heading"},{"key":"B","text":"B. Set color: blue; for the heading"},{"key":"C","text":"C. Set text-style: blue; for the heading"},{"key":"D","text":"D. Set font-color: blue; for the heading"}],"correctKey":"B","answerText":"Answer: B. Set color: blue; for the heading"},{"number":15,"question":"15. How would you create a thin solid border around a <div> element?","options":[{"key":"A","text":"A. Use border: 1px solid;"},{"key":"B","text":"B. Use outline: 1px solid;"},{"key":"C","text":"C. Use box: 1px solid;"},{"key":"D","text":"D. Use edge: 1px solid;"}],"correctKey":"A","answerText":"Answer: A. Use border: 1px solid;"},{"number":16,"question":"16. What approach would you use to link an external CSS file named style.css to an HTML document?","options":[{"key":"A","text":"A. <style src=\"style.css\">"},{"key":"B","text":"B. <csshref=\"style.css\">"},{"key":"C","text":"C. <link rel=\"stylesheet\" href=\"style.css\">"},{"key":"D","text":"D. <script src=\"style.css\"><\/script>"}],"correctKey":"C","answerText":"Answer: C. <link rel=\"stylesheet\" href=\"style.css\">"},{"number":17,"question":"17. How would you create three equal-width columns using CSS Grid?","options":[{"key":"A","text":"A. Set flex-direction: column;"},{"key":"B","text":"B. Set grid-template-rows: repeat(3, 1fr);"},{"key":"C","text":"C. S "question":"14. What approach would you use to reduce latency for a global Azure-hosted website?","options":[{"key":"A","text":"A. Scale up the App Service compute instance size"},{"key":"B","text":"B. Include additional client-side script bundles"},{"key":"C","text":"C. Recompress project files before each build pipeline"},{"key":"D","text":"D. Cache static assets across edge servers using Azure CDN"}],"correctKey":"D","answerText":"Answer: D. Cache static assets across edge servers using Azure CDN"},{"number":15,"question":"15. How would you use Azure DevOps Pipelines to revert a failed release?","options":[{"key":"A","text":"A. Delete and recreate the Azure resource group"},{"key":"B","text":"B. Manually upload past source builds to Blob Storage"},{"key":"C","text":"C. Redeploy the last stable build from the pipeline history"},{"key":"D","text":"D. Configure Azure CDN to permanently lock previous cache files"}],"correctKey":"C","answerText":"Answer: C. Redeploy the last stable build from the pipeline history"},{"number":16,"question":"16. What approach would you use to track live performance metrics of an App Service app?","options":[{"key":"A","text":"A. Inspect rendered page source in the browser"},{"key":"B","text":"B. Enable Azure Monitor and Application Insights"},{"key":"C","text":"C. Review storage container download metrics"},{"key":"D","text":"D. Inspect completed CI/CD build terminal logs"}],"correctKey":"B","answerText":"Answer: B. Enable Azure Monitor and Application Insights"},{"number":17,"question":"17. What approach would you use to secure an Azure Function HTTP endpoint?","options":[{"key":"A","text":"A. Add verification conditions inside HTML template tags"},{"key":"B","text":"B. Obfuscate the function URL inside CSS stylesheets"},{"key":"C","text":"C. Enforce Function access keys or Azure AD authentication"},{"key":"D","text":"D. Route traffic through Azure CDN with caching disabled"}],"correctKey":"C","answerText":"Answer: C. Enforce Function access keys or Azure AD authentication"},{"number":18,"question":"18. What would you do if a website needs both file storage and faster delivery of frequently accessed content?","options":[{"key":"A","text":"A. Use Azure Storage for files and Azure CDN for content delivery"},{"key":"B","text":"B. Use Azure Functions for file storage and App Service for caching"},{"key":"C","text":"C. Use Azure DevOps for file storage and Functions for caching"},{"key":"D","text":"D. Use Static Web Apps for storing all files and HTML tables for delivery"}],"correctKey":"A","answerText":"Answer: A. Use Azure Storage for files and Azure CDN for content delivery"},{"number":19,"question":"19. How would you run backend tasks in a serverless Azure environment?","options":[{"key":"A","text":"A. Provision dedicated virtual server instances manuall"},{"key":"B","text":"B. Trigger Azure Functions on demand without managing servers"},{"key":"C","text":"C. Bundle backend processing scripts into frontend static bundles"},{"key":"D","text":"D. Execute database queries directly inside client browsers"}],"correctKey":"B","answerText":"Answer: B. Trigger Azure Functions on demand without managing servers"},{"number":20,"question":"20. How does Azure Static Web Apps differ from Azure App Service?","options":[{"key":"A","text":"A. Static Web Apps supports server runtimes, while App Service does not"},{"key":"B","text":"B. Static Web Apps is tailored for static UI, while App Service runs full backend stacks"},{"key":"C","text":"C. Both services provide identical serverless hosting capabilities"},{"key":"D","text":"D. Static Web Apps requires manual VM configuration"}],"correctKey":"B","answerText":"Answer: B. Static Web Apps is tailored for static UI, while App Service runs full backend stacks"}]}];
      let activeModuleIndex = 0;
      const answersByModule = {};
      const scoreVisibleByModule = {};

      MODULES.forEach(function (mod) {
        answersByModule[mod.id] = {};
        scoreVisibleByModule[mod.id] = false;
      });

      const tabsEl = document.getElementById('module-tabs');
      const listEl = document.getElementById('questions-list');
      const progressEl = document.getElementById('module-progress');
      const showScoreBtn = document.getElementById('show-score-btn');
      const resetModuleBtn = document.getElementById('reset-module-btn');
      const scoreBoxEl = document.getElementById('score-box');
      const scoreHeadingEl = document.getElementById('score-heading');
      const scoreMetaEl = document.getElementById('score-meta');

      function renderTabs() {
        tabsEl.innerHTML = '';
        MODULES.forEach(function (mod, idx) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.role = 'tab';
          btn.className = 'tab-btn' + (idx === activeModuleIndex ? ' active' : '');
          btn.setAttribute('aria-selected', idx === activeModuleIndex ? 'true' : 'false');
          btn.textContent = mod.label;
          btn.addEventListener('click', function () {
            activeModuleIndex = idx;
            renderAll();
          });
          tabsEl.appendChild(btn);
        });
      }

      function renderQuestions() {
        const mod = MODULES[activeModuleIndex];
        const modAnswers = answersByModule[mod.id];
        listEl.innerHTML = '';

        mod.questions.forEach(function (q) {
          const selectedKey = modAnswers[q.number] || null;
          const isAnswered = selectedKey !== null;
          const isWrongSelection = isAnswered && selectedKey !== q.correctKey;

          const card = document.createElement('article');
          card.className = 'q-card';

          const title = document.createElement('h2');
          title.className = 'q-title';
          title.textContent = q.question;
          card.appendChild(title);

          const optsWrap = document.createElement('div');
          optsWrap.className = 'options';

          q.options.forEach(function (opt) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            btn.disabled = isAnswered;

            const labelSpan = document.createElement('span');
            labelSpan.textContent = opt.text;
            btn.appendChild(labelSpan);

            if (isAnswered) {
              const isSelected = opt.key === selectedKey;
              const isCorrectOption = opt.key === q.correctKey;

              if (isCorrectOption) {
                btn.classList.add('is-correct');
                const badge = document.createElement('span');
                badge.className = 'opt-badge correct';
                badge.textContent = isSelected ? '✓ Correct' : '✓ Correct Answer';
                btn.appendChild(badge);
              } else if (isSelected) {
                btn.classList.add('is-wrong');
                const badge = document.createElement('span');
                badge.className = 'opt-badge wrong';
                badge.textContent = '✕ Wrong';
                btn.appendChild(badge);
              } else {
                btn.classList.add('is-dimmed');
              }
            } else {
              btn.addEventListener('click', function () {
                answersByModule[mod.id][q.number] = opt.key;
                renderQuestions();
                renderProgressAndScore();
              });
            }

            optsWrap.appendChild(btn);
          });

          card.appendChild(optsWrap);

          if (isWrongSelection) {
            const callout = document.createElement('div');
            callout.className = 'answer-callout';
            callout.textContent = q.answerText;
            card.appendChild(callout);
          }

          listEl.appendChild(card);
        });
      }

      function renderProgressAndScore() {
        const mod = MODULES[activeModuleIndex];
        const modAnswers = answersByModule[mod.id];
        const total = mod.questions.length;
        let answered = 0;
        let correct = 0;
        let wrong = 0;

        mod.questions.forEach(function (q) {
          const picked = modAnswers[q.number];
          if (picked) {
            answered++;
            if (picked === q.correctKey) {
              correct++;
            } else {
              wrong++;
            }
          }
        });

        progressEl.textContent = answered + ' / ' + total + ' answered';

        if (scoreVisibleByModule[mod.id]) {
          const pct = Math.round((correct / total) * 100);
          scoreHeadingEl.textContent = mod.label + ' Score: ' + correct + ' / ' + total + ' (' + pct + '%)';
          scoreMetaEl.textContent = 'Correct: ' + correct + '  ·  Wrong: ' + wrong + '  ·  Unanswered: ' + (total - answered);
          scoreBoxEl.classList.add('visible');
        } else {
          scoreBoxEl.classList.remove('visible');
        }
      }

      function renderAll() {
        renderTabs();
        renderQuestions();
        renderProgressAndScore();
      }

      showScoreBtn.addEventListener('click', function () {
        const mod = MODULES[activeModuleIndex];
        scoreVisibleByModule[mod.id] = true;
        renderProgressAndScore();
        scoreBoxEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });

      resetModuleBtn.addEventListener('click', function () {
        const mod = MODULES[activeModuleIndex];
        answersByModule[mod.id] = {};
        scoreVisibleByModule[mod.id] = false;
        renderQuestions();
        renderProgressAndScore();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      renderAll();
    })();
  </script>
</body>
</html>
