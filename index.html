<head>

    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --correct: #22c55e;
            --wrong: #ef4444;
            --border: #334155;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sticky-top {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        header { padding: 12px 16px; text-align: center; }
        header h1 { font-size: 1.1rem; margin: 0; color: var(--accent); }

        .tabs {
            display: flex;
            overflow-x: auto;
            padding: 10px;
            gap: 8px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 0 0 auto;
            padding: 8px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        #quiz-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .q-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .q-text { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }

        .options { display: flex; flex-direction: column; gap: 8px; }

        .opt {
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            cursor: pointer;
        }

        .opt-letter { font-weight: 800; color: var(--accent); margin-right: 10px; }

        .answered .opt { pointer-events: none; }
        .opt.correct { background: var(--correct) !important; border-color: var(--correct); color: white; }
        .opt.wrong { background: var(--wrong) !important; border-color: var(--wrong); color: white; }
        .opt.correct .opt-letter, .opt.wrong .opt-letter { color: white; }

        .feedback {
            margin-top: 12px;
            padding: 8px;
            border-radius: 6px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--correct);
            font-weight: 700;
            font-size: 0.8rem;
            display: none;
            text-align: center;
        }
    </style>
</head>

function loadSet(setNum) {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';
    
    // Update Tab UI
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx + 1) === setNum);
    });

    const startIdx = (setNum - 1) * 35;
    const endIdx = setNum === 6 ? 200 : setNum * 35;
    
    const questionsSlice = allQuestions.slice(startIdx, endIdx);

    questionsSlice.forEach(item => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.id = `qcard-${item.id}`;
        
        let optsHtml = '';
        for (const [key, value] of Object.entries(item.o)) {
            optsHtml += `
                <div class="opt" onclick="check(${item.id}, '${key}', '${item.a}')">
                    <span class="opt-letter">${key}</span>
                    <span>${value}</span>
                </div>`;
        }

        card.innerHTML = `
            <div class="q-text">${item.q}</div>
            <div class="options">${optsHtml}</div>
            <div class="feedback" id="feed-${item.id}">Correct Answer: ${item.a}</div>
        `;
        container.appendChild(card);
    });
    container.scrollTop = 0;
}

function check(qid, choice, correct) {
    const card = document.getElementById(`qcard-${qid}`);
    if (card.classList.contains('answered')) return;

    card.classList.add('answered');
    const opts = card.querySelectorAll('.opt');
    const feed = document.getElementById(`feed-${qid}`);

    opts.forEach(o => {
        const letter = o.querySelector('.opt-letter').innerText;
        if(letter === correct) o.classList.add('correct');
        if(letter === choice && choice !== correct) {
            o.classList.add('wrong');
            feed.style.display = 'block';
        }
    });
}

// Start
loadSet(1);
