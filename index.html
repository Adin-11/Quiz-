<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DS Using C++ & Microsoft Azure — Interactive MCQ Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-soft: #e0f2fe;
      --green-bg: #ecfdf5;
      --green-border: #10b981;
      --green-text: #065f46;
      --red-bg: #fff1f2;
      --red-border: #f43f5e;
      --red-text: #9f1239;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    html.dark {
      --bg: #0b1120;
      --surface: #111827;
      --surface-subtle: #0f172a;
      --border: #1e293b;
      --border-strong: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-soft: rgba(2, 132, 199, 0.16);
      --green-bg: rgba(6, 78, 59, 0.35);
      --green-border: #10b981;
      --green-text: #a7f3d0;
      --red-bg: rgba(136, 19, 55, 0.35);
      --red-border: #f43f5e;
      --red-text: #fecdd3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1024px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .course-meta {
      display: none;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      gap: 8px;
      align-items: center;
    }
    @media (min-width: 768px) {
      .course-meta { display: flex; }
      .header-inner { padding: 14px 24px; }
    }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover:not(:disabled) { background: var(--surface-subtle); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    main {
      max-width: 1024px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    @media (min-width: 640px) {
      main { padding: 32px 24px 56px; }
    }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 1.875rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--text-muted);
    }
    .controls-row {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .controls-row {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }
    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .tab-count {
      font-family: var(--font-mono);
      font-size: 12px;
      opacity: 0.8;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .module-header {
      margin-top: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    @media (min-width: 640px) {
      .module-header {
        flex-direction: row;
        align-items: baseline;
        justify-content: space-between;
      }
    }
    .module-title { margin: 0; font-size: 18px; font-weight: 700; }
    .module-topic { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); }
    .module-stats { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .questions-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    @media (min-width: 640px) {
      .q-card { padding: 24px; }
    }
    .q-text {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.55;
    }
    .q-code, .q-sublines {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      font-family: var(--font-mono);
      font-size: 13px;
      overflow-x: auto;
      white-space: pre;
    }
    .q-diagram {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      display: inline-flex;
      max-width: 100%;
      overflow-x: auto;
    }
    .arr-box {
      display: inline-flex;
      border: 1px solid var(--border-strong);
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 600;
    }
    .arr-cell {
      padding: 8px 16px;
      border-right: 1px solid var(--border-strong);
    }
    .arr-cell:last-child { border-right: none; }
    .matrix-wrap {
      display: inline-flex;
      align-items: stretch;
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 600;
    }
    .matrix-bracket-l {
      width: 8px;
      border-top: 2px solid var(--text-muted);
      border-bottom: 2px solid var(--text-muted);
      border-left: 2px solid var(--text-muted);
      border-radius: 4px 0 0 4px;
    }
    .matrix-bracket-r {
      width: 8px;
      border-top: 2px solid var(--text-muted);
      border-bottom: 2px solid var(--text-muted);
      border-right: 2px solid var(--text-muted);
      border-radius: 0 4px 4px 0;
    }
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 6px 20px;
      padding: 6px 14px;
      text-align: center;
    }
    .options {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-btn {
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface-subtle);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .opt-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.correct {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-text);
      font-weight: 600;
    }
    .opt-btn.wrong {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
      font-weight: 600;
    }
    .opt-btn.muted { opacity: 0.72; }
    .opt-badge {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .feedback-bar {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid;
    }
    .feedback-bar.correct {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-text);
    }
    .feedback-bar.wrong {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
    }
    .score-card {
      margin-top: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .score-top {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @media (min-width: 640px) {
      .score-top {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }
    .score-grid {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .score-mini {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      text-align: left;
      cursor: pointer;
      color: var(--text);
      font-family: inherit;
    }
    .score-mini.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <span class="brand">DS Using C++ &amp; Azure</span>
      <div class="course-meta">
        <span>BCA III Semester</span>
        <span>&middot;</span>
        <span class="mono">25BCACZ31</span>
        <span>&middot;</span>
        <span class="mono">100 MCQs</span>
      </div>
      <button type="button" id="themeToggle" class="btn" aria-label="Toggle dark mode">Light Mode</button>
    </div>
  </header>

  <main>
    <section>
      <h1>All Modules &ndash; Interactive Quiz</h1>
      <p class="subtitle">Click a module tab, select answers, get instant feedback, then show your score.</p>
    </section>

    <section class="controls-row">
      <div class="tabs" id="moduleTabs" role="tablist" aria-label="Quiz modules"></div>
      <div class="actions">
        <button type="button" id="showScoreBtn" class="btn">Show Score</button>
        <button type="button" id="resetModuleBtn" class="btn">Reset</button>
      </div>
    </section>

    <section class="module-header" id="moduleHeader"></section>
    <section class="questions-list" id="questionsList"></section>
    <section class="score-card" id="scoreCard"></section>
  </main>

  <script>
    const QUIZ_MODULES = [
  {
    "id": "module-1",
    "tabLabel": "Module 1",
    "pdfModuleHeading": "Module1",
    "pdfSectionHeading": "I. Multiple choice questions",
    "topicSummary": "Arrays, Linked Lists, Searching, Bubble Sort & Sparse Matrices",
    "questions": [
      {
        "id": "m1-q1",
        "question": "1. What is a data structure?",

          "A. A programming language",
          "B. A method of organizing and storing data",
          "C. A computer network",
          "D. An operating system"
        ],
        "correctIndex": 1,
        "answerText": "Answer: B. A method of organizing and storing data"
      },
      {
        "id": "m1-q2",
        "question": "2. Which searching technique requires the array to be sorted?",
        "options": [
          "A. Array Traversal",
          "B. Array Insertion",
          "C. Binary Search",
          "D. Linked List Deletion"
        ],
        "correctIndex": 2,
        "answerText": "Answer: C) Binary Search"
      },
      {
        "id": "m1-q3",
        "question": "3. Which of the following is a linear data structure?",
        "options": [
          "A. Array",
          "B. Sparse Matrix",
          "C. Binary Search",
          "D. Bubble Sort"
        ],
        "correctIndex": 0,
        "answerText": "Answer: A. Array"
      },
      {
        "id": "m1-q4",
        "question": "4. What is a node in a linked list?",
        "options": [
          "A. A memory block containing data and a link",
          "B. An array index",
          "C. A function",
          "D. A loop"
        ],
        "correctIndex": 0,
        "answerText": "Answer: A. A memory block containing data and a link"
      },
      {
        "id": "m1-q5",
        "question": "5. Which pointer is commonly used to store the address of the next node in a linked list?",
        "options": [
          "A. Front",
          "B. Next",
          "C. Top",
          "D. Rear"
        ],
        "correctIndex": 1,
        "answerText": "Answer: B. Next"
      },
      {
        "id": "m1-q6",
        "question": "6. What is the main function of array traversal?",

          "A. To delete elements",
          "B. To visit each element one by one",
          "C. To sort elements",
          "D. To insert elements"
        ],
        "correctIndex": 1,
        "answerText": "Answer: B. To visit each element one by one"
      },
      {
        "id": "m1-q7",
        "question": "7. What is a sparse matrix?",

          "B. A matrix containing mostly zero elements",

      {
        "id": "m1-q8",

          "C. Stack",

        "correctIndex": 1,
        "answerText": "Answer: B) Linked List"
      },
      {
        "id": "m1-q9",
        "question": "9. Which of the following is a prerequisite for performing Binary Search?",
        "options": [
          "A. Peek",
          "B. Sorting",
          "C. Deletion",
          "D. Insertion"
        ],
        "correctIndex": 1,
        "answerText": "Answer: B. Sorting"
      },
      {
        "id": "m1-q10",
        "question": "10. What is a linked list?",
        "options": [
          "A. A fixed-size data structure",
          "B. A dynamic data structure made up of linked nodes",
          "C. A two-dimensional array",
          "D. A sorting algorithm"
        ],
        "correctIndex": 1,
        "answerText": "Answer: B. A dynamic data structure made up of linked nodes"
      },
      {
        "id": "m1-q11",
        "question": "11. Find the output of the following C++ code:",

        "options": [
          "A. 50",
          "B. 60",
          "C. 30",
          "D. 41"
        ],
        "correctIndex": 2,
        "answerText": "Answer: C. 30"
      },
      {
        "id": "m1-q12",
        "question": "12. What would be the result after comparing and swapping the first two elements while applying Bubble Sort to the list 30, 10, 20, 40, 15?",
        "options": [
          "A. 10, 30, 20, 40, 15",
          "B. 30, 20, 10, 40, 15",
          "C. 20, 10, 30, 40, 15",

        ],
        "correctIndex": 0,
        "answerText": "Answer: A. 10, 30, 20, 40, 15"
      },
      {
        "id": "m1-q13",
        "question": "13. What would you do to insert 15 at position 1 in the array 10, 20, 30 while maintaining the existing elements?",

        "answerText": "Answer: A. Shift elements to the right and insert 15"
      },
      {
        "id": "m1-q14",

      {

          "B. 20",
          "C. 30",
          "D. 40"

      {

      {
        "id": "m1-q20",

        "correctIndex": 0,
        "answerText": "Answer: A. Row 0, Column 2, Value 5"
      }
    ]
  },
  {
    "id": "module-2",
    "tabLabel": "Module 2",
    "pdfModuleHeading": "Module 2",
    "pdfSectionHeading": "I. Multiple Choice Questions:",
    "topicSummary": "Stacks, LIFO Operations, Recursion & Expression Notation",
    "questions": [
      {
        "id": "m2-q1",
        "question": "1. What is a stack?",
        "options": [
          "a) Queue data structure",

          "c) Tree structure",

        "answerText": "Answer: b) Linear data structure"
      },
      {
        "id": "m2-q2",

        "answerText": "Answer: C. Peek"

      {
        "id": "m2-q3",

        "answerText": "Answer: B. Push"
      },
      {
        "id": "m2-q4",

      {
        "id": "m2-q5",

      {

    function getStats(mod) {
      let answered = 0, correct = 0;
      mod.questions.forEach(q => {
        const picked = state.selections[q.id];
        if (picked !== undefined) {
          answered++;
          if (picked === q.correctIndex) correct++;
        }
      });
      return { answered, correct, total: mod.questions.length };
    }

    function render() {
      const activeMod = QUIZ_MODULES.find(m => m.id === state.activeModuleId) || QUIZ_MODULES[0];
      const activeStats = getStats(activeMod);

      // Tabs
      const tabsEl = document.getElementById('moduleTabs');
      tabsEl.innerHTML = QUIZ_MODULES.map(mod => {
        const s = getStats(mod);
        const isActive = mod.id === activeMod.id;
        return '<button type="button" role="tab" aria-selected="' + isActive + '" class="tab-btn ' + (isActive ? 'active' : '') + '" data-mod="' + mod.id + '">' +
          '<span>' + escapeHtml(mod.tabLabel) + '</span>' +
          '<span class="tab-count">' + s.answered + '/' + s.total + '</span>' +
          '</button>';
      }).join('');

      tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeModuleId = btn.getAttribute('data-mod');
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      document.getElementById('resetModuleBtn').disabled = activeStats.answered === 0;

      // Header
      document.getElementById('moduleHeader').innerHTML =
        '<div>' +
          '<h2 class="module-title">' + escapeHtml(activeMod.pdfModuleHeading) + ' &mdash; ' + escapeHtml(activeMod.pdfSectionHeading) + '</h2>' +
          '<p class="module-topic">' + escapeHtml(activeMod.topicSummary) + '</p>' +
        '</div>' +
        '<div class="module-stats">Answered: <strong>' + activeStats.answered + '</strong> / ' + activeStats.total + ' &middot; Correct: <strong style="color:var(--green-border)">' + activeStats.correct + '</strong></div>';

      // Questions
      const listEl = document.getElementById('questionsList');
      listEl.innerHTML = activeMod.questions.map(q => {
        const picked = state.selections[q.id];
        const isAnswered = picked !== undefined;
        const isCorrect = isAnswered && picked === q.correctIndex;

        let extraHtml = '';
        if (q.subLines && q.subLines.length) {
          extraHtml += '<div class="q-sublines">' + q.subLines.map(escapeHtml).join('\\n') + '</div>';
        }
        if (q.code) {
          extraHtml += '<pre class="q-code"><code>' + escapeHtml(q.code) + '</code></pre>';
        }
        if (q.diagram) {
          extraHtml += renderDiagram(q.diagram);
        }

        const optionsHtml = q.options.map((opt, idx) => {
          let cls = 'opt-btn';
          let badge = '';
          if (isAnswered) {
            if (idx === q.correctIndex) {
              cls += ' correct';
              badge = '<span class="opt-badge">' + (picked === idx ? '&#10003; Correct' : '&#10003; Correct Answer') + '</span>';
            } else if (picked === idx) {
              cls += ' wrong';
              badge = '<span class="opt-badge">&#10007; Wrong</span>';
            } else {
              cls += ' muted';
            }
          }
          return '<button type="button" class="' + cls + '" ' + (isAnswered ? 'disabled' : '') + ' data-qid="' + q.id + '" data-idx="' + idx + '">' +
            '<span>' + escapeHtml(opt) + '</span>' + badge +
            '</button>';
        }).join('');

        const feedbackHtml = isAnswered
          ? '<div class="feedback-bar ' + (isCorrect ? 'correct' : 'wrong') + '" role="status">' +
              '<strong>' + (isCorrect ? 'Correct! ' : 'Wrong answer. ') + '</strong>' + escapeHtml(q.answerText) +
            '</div>'
          : '';

        return '<article class="q-card">' +
          '<h3 class="q-text">' + escapeHtml(q.question) + '</h3>' +
          extraHtml +
          '<div class="options">' + optionsHtml + '</div>' +
          feedbackHtml +
        '</article>';
      }).join('');

      listEl.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const qid = btn.getAttribute('data-qid');
          const idx = Number(btn.getAttribute('data-idx'));
          if (state.selections[qid] === undefined) {
            state.selections[qid] = idx;
            render();
          }
        });
      });

      // Score Card
      const pct = activeStats.total ? Math.round((activeStats.correct / activeStats.total) * 100) : 0;
      let totalCorrect = 0, totalAnswered = 0, totalQuestions = 0;
      const miniHtml = QUIZ_MODULES.map(m => {
        const s = getStats(m);
        totalCorrect += s.correct;
        totalAnswered += s.answered;
        totalQuestions += s.total;
        const mPct = s.total ? Math.round((s.correct / s.total) * 100) : 0;
        return '<button type="button" class="score-mini ' + (m.id === activeMod.id ? 'active' : '') + '" data-jump="' + m.id + '">' +
          '<div style="font-size:12px;font-weight:700">' + escapeHtml(m.tabLabel) + '</div>' +
          '<div class="mono" style="font-size:15px;font-weight:700;color:var(--green-border);margin-top:4px">' + s.correct + '/' + s.total + '</div>' +
          '<div style="font-size:12px;color:var(--text-muted);margin-top:2px">' + s.answered + ' answered &middot; ' + mPct + '%</div>' +
          '</button>';
      }).join('');

      const scoreEl = document.getElementById('scoreCard');
      scoreEl.innerHTML =
        '<div class="score-top">' +
          '<div>' +
            '<h2 style="margin:0;font-size:18px;font-weight:700">' + escapeHtml(activeMod.tabLabel) + ' Score Summary</h2>' +
            '<p style="margin:4px 0 0;font-size:14px;color:var(--text-muted)">You scored <strong>' + activeStats.correct + ' / ' + activeStats.total + '</strong> (' + pct + '%) &middot; ' + activeStats.answered + ' of ' + activeStats.total + ' answered</p>' +
          '</div>' +
          '<div class="actions">' +
            '<button type="button" id="toggleAllScoresBtn" class="btn btn-primary">' + (state.showAllScores ? 'Hide All Modules Score' : 'Show All Modules Score') + '</button>' +
            '<button type="button" id="topBtn" class="btn">Top</button>' +
          '</div>' +
        '</div>' +
        (state.showAllScores
          ? '<div style="margin-top:16px;font-size:13px;font-weight:600">All Modules Overall: <span class="mono" style="color:var(--accent)">' + totalCorrect + ' / ' + totalQuestions + ' correct (' + totalAnswered + ' answered)</span></div><div class="score-grid">' + miniHtml + '</div>'
          : '');

      document.getElementById('toggleAllScoresBtn').addEventListener('click', () => {
        state.showAllScores = !state.showAllScores;
        render();
      });
      document.getElementById('topBtn').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      scoreEl.querySelectorAll('.score-mini').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeModuleId = btn.getAttribute('data-jump');
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      state.dark = !state.dark;
      applyTheme();
    });

    document.getElementById('showScoreBtn').addEventListener('click', () => {
      state.showAllScores = true;
      render();
      document.getElementById('scoreCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    document.getElementById('resetModuleBtn').addEventListener('click', () => {
      const activeMod = QUIZ_MODULES.find(m => m.id === state.activeModuleId) || QUIZ_MODULES[0];
      activeMod.questions.forEach(q => { delete state.selections[q.id]; });
      render();
    });

    applyTheme();
    render();
  </script>
</body>
</html>
